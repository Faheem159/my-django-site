{% extends 'myapp/base.html' %}
{% block title %}Sign Up{% endblock %}
{% block content %}

<div style="max-width: 420px; margin: 4rem auto;">
  <h1 style="font-family: 'DM Serif Display', serif; font-size: 28px; font-weight: 400; margin-bottom: 0.5rem;">Create an account</h1>
  <p style="font-size: 13px; color: #5f5e5a; margin-bottom: 1.5rem;">Already have one? <a href="{% url 'login' %}" style="color: #185FA5;">Log in</a></p>

  <div class="card">
    <form method="POST">
      {% csrf_token %}

      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" name="username" required>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" required>
      </div>

      <div class="form-group">
        <label class="form-label">Confirm password</label>
        <input type="password" name="confirm" required>
      </div>

      <div class="form-group">
        <label class="form-label">I am a...</label>
        <div style="display: flex; gap: 10px; margin-top: 4px;">
          <label style="flex:1; cursor:pointer;">
            <input type="radio" name="role" value="Landlord" style="display:none" {% if role == 'Landlord' %}checked{% endif %} >
            <div class="role-btn" id="btn-landlord">
              <div style="font-size: 22px; margin-bottom: 4px;">🏠</div>
              <div style="font-size: 13px; font-weight: 500;">Landlord</div>
              <div style="font-size: 11px; color: #888780;">I manage properties</div>
            </div>
          </label>
          <label style="flex:1; cursor:pointer;">
            <input type="radio" name="role" value="Tenant" style="display:none" {% if role == 'Tenant' %}checked{% endif %}>
            <div class="role-btn" id="btn-tenant">
              <div style="font-size: 22px; margin-bottom: 4px;">🔑</div>
              <div style="font-size: 13px; font-weight: 500;">Tenant</div>
              <div style="font-size: 11px; color: #888780;">I rent a property</div>
            </div>
          </label>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%; margin-top: 0.5rem;">Create account</button>
    </form>
  </div>
</div>

<style>
  .role-btn {
    border: 0.5px solid #d3d1c7;
    border-radius: 10px;
    padding: 14px;
    text-align: center;
    transition: all 0.15s;
    background: #fff;
  }
  .role-btn.active {
    border-color: #185FA5;
    background: #E6F1FB;
  }
  input[type="radio"]:checked + .role-btn {
    border-color: #185FA5;
    background: #E6F1FB;
  }
</style>

<script>
  document.querySelectorAll('input[name="role"]').forEach(radio => {
    radio.addEventListener('change', () => {
      document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
      radio.nextElementSibling.classList.add('active');
    });
    if (radio.checked) radio.nextElementSibling.classList.add('active');
  });
</script>
{% endblock %}
